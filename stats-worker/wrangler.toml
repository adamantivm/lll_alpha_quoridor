name = "quoridor-stats"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Origins allowed to POST game records. The play site plus a local dev server;
# anything else gets no CORS headers and a 403.
[vars]
ALLOWED_ORIGINS = "https://adamantivm.github.io,http://localhost:5173,http://127.0.0.1:5173"

[[d1_databases]]
binding = "DB"
database_name = "quoridor-stats"
# Filled in by `npx wrangler d1 create quoridor-stats` -- see README.md.
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Writes happen once per move, so a public endpoint needs a cap. 120 requests
# per minute per IP is far above a human playing one game and far below anything
# that would matter to the free tier.
[[unsafe.bindings]]
name = "RATE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
